# Phase 1 — SFT baseline.
# Llama-3.1-8B-Instruct + QLoRA (4-bit NF4 + LoRA r=16).
# Deviation vs paper: paper used Llama-3.0-8B-Instruct. Architecture identical;
# expect SFT baseline to be 1-2 points higher than paper's SFT baseline.

experiment:
  id: "sft_baseline"
  description: "SFT comparator for DPO; Llama-3.1-8B-Instruct + QLoRA"
  paper_phase: "phase-1"

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  revision: null            # TODO: fill commit hash after first download on remote
  trust_remote_code: false
  attn_implementation: "flash_attention_2"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 16         # paper §4.1.2: r=alpha=16 (NOT 2×r as is common); matches FinDPO paper
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

datasets:
  fpb:
    repo: "takala/financial_phrasebank"
    config: "sentences_50agree"
    revision: null          # TODO: pin commit hash on remote
    split_for_train_eval: true
  tfns:
    repo: "zeroshot/twitter-financial-news-sentiment"
    revision: null
    split_for_train_eval: true
  gpt_news:
    # Verified 2026-05-13 from FinDPO paper §4.1.1 citation [25]: Oliver Wang
    # "News with GPT instructions" — labels are STRING (strong/moderately/
    # mildly negative/positive + neutral) merged to 3 classes via labels.py.
    repo: "oliverwang15/news_with_gpt_instructions"
    revision: null         # pin commit hash on remote after first download
    split_for_train_eval: true

split:
  train_ratio: 0.8
  split_seed: 42            # split is reproducible from this seed independent of training seed
  save_indices: true

prompt:
  system: "You are a financial sentiment classifier. Read the financial text and respond with exactly one word: positive, neutral, or negative."

train:
  output_dir_base: "results"
  seed: 42                  # overridden by --seed CLI; default for first run
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4    # effective batch 16
  per_device_eval_batch_size: 8
  learning_rate: 2.0e-4              # QLoRA-typical LR (paper used full FT lr=2e-5; QLoRA adapter needs ~10x)
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 512
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_32bit"
  logging_steps: 10
  save_strategy: "epoch"          # must match eval_strategy for load_best_model_at_end
  save_total_limit: 3
  eval_strategy: "epoch"
  load_best_model_at_end: true
  # eval_loss is computed by Trainer automatically; macro_f1 would need a
  # compute_metrics callback which is too expensive to run every epoch
  # (would force generation over the eval set). Final classification eval
  # runs once in 01_sft_eval.py after training.
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: ["wandb"]

eval:
  on_dataset: "fpb"          # primary benchmark for repro comparison
  test_split: "test"
  metrics:
    - accuracy
    - macro_f1
    - per_class_precision
    - per_class_recall
    - confusion_matrix

wandb:
  project: "findpo-repro"
  tags: ["phase-1", "sft", "qlora", "llama-3.1-8b"]
