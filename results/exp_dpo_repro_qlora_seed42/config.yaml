experiment:
  id: dpo_repro_qlora
  description: DPO reproduction; QLoRA NF4; rejected = SFT-confused class (Strategy
    B)
  paper_phase: phase-2
model:
  name: unsloth/Meta-Llama-3.1-8B-Instruct
  revision: a2856192dd7c25b842431f39c179a6c2c2f627d1
  trust_remote_code: false
  attn_implementation: flash_attention_2
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
datasets:
  fpb:
    repo: takala/financial_phrasebank
    config: sentences_50agree
    revision: 8d3fe0c36d5feec6b3cc5e455b0fcb4820fb9964
  tfns:
    repo: zeroshot/twitter-financial-news-sentiment
    revision: ccbe24de388e287beb92dd393a335c376b350ac3
  gpt_news:
    repo: oliverwang15/news_with_gpt_instructions
    revision: b7c333378679b2a74d7248b407c06021d3f26adb
split:
  train_ratio: 0.8
  split_seed: 42
preference_pairs:
  strategy: AB
prompt:
  system: 'You are a financial sentiment classifier. Read the financial text and respond
    with exactly one word: positive, neutral, or negative.'
train:
  output_dir_base: results
  seed: 42
  beta: 0.1
  num_train_epochs: 5
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 8
  learning_rate: 5.0e-06
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_length: 512
  max_prompt_length: 384
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_32bit
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 3
  eval_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_rewards/accuracies
  greater_is_better: true
  report_to:
  - wandb
  loss_type: sigmoid
  label_smoothing: 0.0
  generate_during_eval: false
  precompute_ref_log_probs: false
eval:
  on_dataset: fpb
  test_split: test
  metrics:
  - accuracy
  - macro_f1
  - per_class_precision
  - per_class_recall
  - confusion_matrix
wandb:
  project: findpo-repro
  tags:
  - phase-2
  - dpo
  - qlora
  - llama-3.1-8b
  - strategy-b
