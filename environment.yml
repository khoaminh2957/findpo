name: findpo
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # RTX PRO 6000 Blackwell is sm_120 — needs PyTorch ≥ 2.7.0 + cu128. Earlier
  # PyTorch/CUDA combos lack Blackwell kernels and crash at model load.
  - pytorch>=2.7.0
  - pytorch-cuda=12.8
  - cuda-toolkit=12.8
  - pip:
      - -r requirements.txt
      # flash-attn must be installed AFTER torch. PyPI ships only a source
      # tarball (verified 2026-05-13 — no precompiled wheels for any 2.7.x
      # or 2.8.x version), so pip will build from source (30-60 min).
      # See README install order:
      #   pip install flash-attn==2.8.3 --no-build-isolation
      # Community prebuilt wheels for sm_120 + cu128 + torch2.7+ at:
      #   https://huggingface.co/lldacing/flash-attention-prebuild-wheels
